<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Arena B12 — Financeiro</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0a0a0a;color:#fff;font-family:'Barlow',sans-serif}
#loginScreen{display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column}
.login-card{background:#111;border:1px solid #1e1e1e;border-radius:10px;padding:40px 48px;width:340px;text-align:center}
.logo{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:800;margin-bottom:6px}
.logo .a{color:#FF620B}.logo .b{color:#fff}
.subtitle{font-size:11px;letter-spacing:3px;color:#444;margin-bottom:32px}
.pin-label{font-size:10px;letter-spacing:2px;color:#555;margin-bottom:12px;text-align:left}
.pin-input{width:100%;background:#161616;border:1px solid #2a2a2a;border-radius:4px;color:#fff;padding:12px 16px;font-size:20px;letter-spacing:8px;text-align:center;font-family:'Barlow Condensed',sans-serif;outline:none;transition:border-color .2s}
.pin-input:focus{border-color:#FF620B}
.btn-enter{width:100%;margin-top:14px;background:#FF620B;color:#fff;border:none;border-radius:4px;padding:12px;font-size:13px;font-weight:700;letter-spacing:1px;font-family:'Barlow Condensed',sans-serif;cursor:pointer;transition:opacity .15s}
.btn-enter:hover{opacity:.85}
.error{color:#ff4444;font-size:12px;margin-top:10px;height:18px}
#appFrame{display:none;position:fixed;inset:0;width:100%;height:100%;border:none}
</style>
</head>
<body>
<div id="loginScreen">
  <div class="login-card">
    <div class="logo"><span class="a">ARENA</span><span class="b">B12</span></div>
    <div class="subtitle">FINANCEIRO</div>
    <div class="pin-label">SENHA DE ACESSO</div>
    <input type="password" class="pin-input" id="pinInput" maxlength="20" placeholder="••••" onkeydown="if(event.key==='Enter')checkPin()"/>
    <button class="btn-enter" onclick="checkPin()">ENTRAR →</button>
    <div class="error" id="errorMsg"></div>
  </div>
</div>
<iframe id="appFrame" src="about:blank"></iframe>
<script>
const HASH = '4540403f';
function hashPin(p){let h='';for(let i=0;i<p.length;i++)h+=(p.charCodeAt(i)+13).toString(16);return h;}
function checkPin(){
  const pin=document.getElementById('pinInput').value;
  if(hashPin(pin)===HASH){sessionStorage.setItem('b12auth','1');showApp();}
  else{
    const e=document.getElementById('errorMsg');
    e.textContent='Senha incorreta.';
    setTimeout(()=>e.textContent='',2000);
    document.getElementById('pinInput').value='';
    document.getElementById('pinInput').focus();
  }
}
function showApp(){
  document.getElementById('loginScreen').style.display='none';
  const f=document.getElementById('appFrame');
  f.src='https://gustavobecker13br.github.io/arenab12-financeiro/';
  f.style.display='block';
}
if(sessionStorage.getItem('b12auth')==='1') showApp();
</script>
</body>
</html>
